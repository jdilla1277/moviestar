[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "moviestar"
version = "0.8.4"
description = "Video editing CLI for AI agents. Compose and shape scenes, animate camera moves, retime footage, mix audio, burn captions, and render with FFmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "src/moviestar/fonts/OFL-LICENSE.txt",
]
authors = [{name = "James Dillard"}]
keywords = ["video", "ffmpeg", "ai", "agents", "cli", "transcript", "whisper", "editing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "keyring>=25.0",
    "rapidfuzz>=3.0",
    "uharfbuzz>=0.53.0",  # Apache-2.0; bundled HarfBuzz: MIT (see docs/font-metrics.md)
]

[project.urls]
Homepage = "https://trymoviestar.com"
Documentation = "https://github.com/jdilla1277/moviestar/tree/main/docs"
Repository = "https://github.com/jdilla1277/moviestar"
Issues = "https://github.com/jdilla1277/moviestar/issues"

[project.optional-dependencies]
transcribe = [
    "av<19",  # faster-whisper 1.2.1 passes av.open(metadata_errors=...), removed in av 19
    "faster-whisper>=1.0",
]
# Diarization also needs local transcription, as it did before the split.
diarize = ["av<19", "faster-whisper>=1.0", "pyannote.audio>=3.0"]
# --captions URL fetches caption tracks with yt-dlp (Unlicense).
url-captions = ["yt-dlp>=2026.8.19"]

[project.scripts]
moviestar = "moviestar.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"moviestar.schema" = ["*.json"]
"moviestar" = ["fonts/*.ttf", "fonts/OFL-LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that call real faster-whisper (skipped by default; use --run-slow to include).",
]
