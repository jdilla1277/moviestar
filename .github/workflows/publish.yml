name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/moviestar/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release tag and package version
        run: python bin/check-release-version "$GITHUB_REF_NAME"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build and inspect package artifacts
        run: |
          python -m build app
          python -m twine check app/dist/*

      # release/v1 was reviewed and pinned on 2026-09-16.
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: app/dist
