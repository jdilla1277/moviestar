name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  base-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: Build and install the base wheel with normal dependency resolution
        run: |
          python -m pip install build
          python -m build app
          python -m venv .context/base-wheel
          .context/base-wheel/bin/python -m pip install app/dist/*.whl pytest packaging
      - name: Verify account and Cloud commands without local media dependencies
        env:
          MOVIESTAR_WHEEL_TEST_PYTHON: ${{ github.workspace }}/.context/base-wheel/bin/python
        run: |
          .context/base-wheel/bin/python -m pytest app/tests/test_lightweight_install.py -q
          .context/base-wheel/bin/python bin/check-dependency-licenses

  docs-and-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate public docs and Moviestar skill
        run: |
          python -m pip install pytest
          python -m pip install --no-deps -e ./app
          python -m pytest \
            app/tests/test_public_docs_and_skill.py \
            app/tests/test_release_plumbing.py \
            -q

  test:
    # Keep the OS/distro FFmpeg policy explicit as ubuntu-latest migrates.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [fast, full]

    steps:
      - uses: actions/checkout@v6

      # Cache pip downloads (~150MB of wheels: PyAV, CTranslate2, ONNX
      # Runtime, NumPy) so install time doesn't depend on PyPI throughput;
      # a slow mirror once stretched install to 18 minutes and timed out
      # the job. The venv's pip shares this ~/.cache/pip.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/pyproject.toml

      # Keep Ubuntu's package provenance, but avoid downloading the complete
      # FFmpeg dependency set for every job. Image changes get a fresh cache;
      # older image archives are hints only: apt resolves current versions.
      - name: Identify FFmpeg package cache
        id: ffmpeg-cache
        env:
          SETUP_HASH: ${{ hashFiles('bin/setup-ci-ffmpeg') }}
        run: |
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "prefix=ffmpeg-ubuntu26-${RUNNER_ARCH}-${ImageVersion}-${SETUP_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore Ubuntu FFmpeg downloads
        timeout-minutes: 1
        continue-on-error: true
        id: ffmpeg-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/moviestar-apt/*.deb
          # This lookup key is never saved: old exact hits cannot shadow a
          # newer repaired generation selected by the first restore prefix.
          key: ${{ steps.ffmpeg-cache.outputs.prefix }}-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.ffmpeg-cache.outputs.prefix }}-content-
            ffmpeg-ubuntu26-${{ runner.arch }}-${{ steps.ffmpeg-cache.outputs.image }}-
            ffmpeg-ubuntu26-${{ runner.arch }}-

      - name: Fingerprint restored FFmpeg downloads
        id: ffmpeg-before
        timeout-minutes: 1
        continue-on-error: true
        run: python bin/setup-ci-ffmpeg --archive-fingerprint "$RUNNER_TEMP/moviestar-apt" >> "$GITHUB_OUTPUT"

      - name: Set up and verify FFmpeg
        timeout-minutes: 4
        run: python bin/setup-ci-ffmpeg --apt-cache "$RUNNER_TEMP/moviestar-apt"

      - name: Fingerprint verified FFmpeg downloads
        id: ffmpeg-after
        timeout-minutes: 1
        continue-on-error: true
        run: python bin/setup-ci-ffmpeg --archive-fingerprint "$RUNNER_TEMP/moviestar-apt" >> "$GITHUB_OUTPUT"

      # Save before package tests, so an unrelated test failure cannot discard
      # a successful setup. Exclude partial downloads, locks and installed state.
      - name: Save verified Ubuntu FFmpeg downloads
        timeout-minutes: 1
        continue-on-error: true
        # Content changes (including repair back to the original digest) need
        # a new immutable generation. Unchanged current-format caches are reused.
        if: >-
          steps.ffmpeg-after.outputs.digest != '' &&
          (steps.ffmpeg-before.outputs.digest != steps.ffmpeg-after.outputs.digest ||
           !startsWith(steps.ffmpeg-downloads.outputs.cache-matched-key,
             format('{0}-content-{1}-', steps.ffmpeg-cache.outputs.prefix, steps.ffmpeg-after.outputs.digest)))
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/moviestar-apt/*.deb
          key: ${{ steps.ffmpeg-cache.outputs.prefix }}-content-${{ steps.ffmpeg-after.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Cache the faster-whisper tiny model so CI doesn't re-download ~75MB
      # on every run. Key includes the model name; bump to invalidate.
      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-tiny-v1

      - name: Install moviestar
        run: |
          cd app
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[transcribe]" pytest

      - name: Check dependency license policy
        run: |
          source app/.venv/bin/activate
          bin/check-dependency-licenses
          bin/check-dependency-licenses --extra transcribe

      # --captions URL needs the url-captions extra (yt-dlp). Install it
      # after the core check so the fast tests cover the real backend too.
      - name: Check url-captions extra license policy
        run: |
          source app/.venv/bin/activate
          pip install -e "./app[url-captions]"
          bin/check-dependency-licenses --extra transcribe --extra url-captions

      # Fast path: everything except slow (whisper) tests. Gives quick
      # signal on most failures even if the slow path breaks.
      - name: Run fast tests
        if: matrix.suite == 'fast'
        run: |
          cd app
          source .venv/bin/activate
          pytest -v

      # Full path: includes slow whisper tests. --run-slow is the
      # conftest.py opt-in.
      - name: Run full suite (with --run-slow)
        if: matrix.suite == 'full'
        run: |
          cd app
          source .venv/bin/activate
          pytest --run-slow

      - name: Build and check package artifacts
        if: matrix.suite == 'full'
        run: |
          source app/.venv/bin/activate
          python -m pip install build twine
          python -m build app
          python -m twine check app/dist/*
