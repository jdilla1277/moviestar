name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-and-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate public docs and Moviestar skill
        run: |
          python -m pip install pytest
          python -m pip install --no-deps -e ./app
          python -m pytest \
            app/tests/test_public_docs_and_skill.py \
            app/tests/test_release_plumbing.py \
            -q

  compositor-python310:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: Install FFmpeg and Python dependencies
        run: |
          python bin/install-ci-ffmpeg
          python -m pip install -e ./app pytest "numpy==1.24.4" "av==16.1.0"
      - name: Compare rendering with FFmpeg on minimum Python, NumPy and PyAV
        run: |
          python -c "import av; assert av.__version__ == '16.1.0', av.__version__"
          python -m pytest app/tests/test_spatial_composite.py -q
          # Headless decoder coverage includes real reformat calls, exact RGB,
          # timestamp selection, format fallbacks, eviction and cleanup. Full
          # browser composition/export coverage runs in the main test job.
          python -m pytest app/tests/test_spatial_media_session.py -q -k 'not session_frames_match_full_reference_composition'
          python -m pytest app/tests/test_spatial_stream.py -q -k 'not direct_pixels and not cli_uses_pixels and not same_source_static_and_motion'
          python bin/check-dependency-licenses

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MOVIESTAR_CHROME_NO_SANDBOX: '1'

    steps:
      - uses: actions/checkout@v6

      # Cache pip downloads (~150MB of wheels: PyAV, CTranslate2, ONNX
      # Runtime, NumPy) so install time doesn't depend on PyPI throughput;
      # a slow mirror once stretched install to 18 minutes and timed out
      # the job. The venv's pip shares this ~/.cache/pip.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/pyproject.toml

      # Moviestar shells out to FFmpeg and ffprobe for media operations.
      - name: Install ffmpeg
        run: |
          python bin/install-ci-ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # Exercise the supported headless-shell renderer explicitly rather than
      # whichever desktop Chrome happens to ship in the runner image.
      - name: Install Chrome for Testing headless shell
        env:
          CHROME_FOR_TESTING_VERSION: '156.0.8078.73'
        run: |
          archive="$RUNNER_TEMP/moviestar-chrome.zip"
          curl --fail --location --silent --show-error \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64/chrome-headless-shell-linux64.zip" \
            --output "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP/moviestar-chrome"
          chrome_path="$RUNNER_TEMP/moviestar-chrome/chrome-headless-shell-linux64/chrome-headless-shell"
          "$chrome_path" --version
          node --version
          echo "MOVIESTAR_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      # Cache the faster-whisper tiny model so CI doesn't re-download ~75MB
      # on every run. Key includes the model name; bump to invalidate.
      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-tiny-v1

      - name: Install moviestar
        run: |
          cd app
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Check renderer cold startup
        run: |
          source app/.venv/bin/activate
          python - <<'PY'
          from moviestar.spatial_layout import browser_available, measure_spatial_layout
          assert browser_available(), 'Renderer CI requires Chrome headless shell and Node.js 22+'
          measured = measure_spatial_layout({'scene_id': 'ci_smoke', 'children': []}, {'width': 64, 'height': 64})
          assert measured['boxes'] == []
          print('Configured renderer completed a cold-start measurement.')
          PY

      - name: Check dependency license policy
        run: |
          source app/.venv/bin/activate
          bin/check-dependency-licenses

      # --captions URL needs the url-captions extra (yt-dlp). Install it
      # after the core check so the fast tests cover the real backend too.
      - name: Check url-captions extra license policy
        run: |
          source app/.venv/bin/activate
          pip install -e "./app[url-captions]"
          bin/check-dependency-licenses --extra url-captions

      - name: Run full suite (with --run-slow)
        run: |
          cd app
          source .venv/bin/activate
          pytest --run-slow --ignore=tests/test_native_pip_browser.py --ignore=tests/test_native_cuts_browser.py --ignore=tests/test_native_interview_browser.py --basetemp="$RUNNER_TEMP/full-suite"

      - name: Retain first speed playback evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-speed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-suite/test_actual_speed_preview_*/browser/*.json
          if-no-files-found: warn

      - name: Build and check package artifacts
        run: |
          source app/.venv/bin/activate
          python -m pip install build twine
          python -m build app
          python -m twine check app/dist/*

  native-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOVIESTAR_CHROME_NO_SANDBOX: '1'

    steps:
      - uses: actions/checkout@v6

      # Cache pip downloads (~150MB of wheels: PyAV, CTranslate2, ONNX
      # Runtime, NumPy) so install time doesn't depend on PyPI throughput;
      # a slow mirror once stretched install to 18 minutes and timed out
      # the job. The venv's pip shares this ~/.cache/pip.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/pyproject.toml

      # Moviestar shells out to FFmpeg and ffprobe for media operations.
      - name: Install ffmpeg
        run: |
          python bin/install-ci-ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # Exercise the supported headless-shell renderer explicitly rather than
      # whichever desktop Chrome happens to ship in the runner image.
      - name: Install Chrome for Testing headless shell
        env:
          CHROME_FOR_TESTING_VERSION: '156.0.8078.73'
        run: |
          archive="$RUNNER_TEMP/moviestar-chrome.zip"
          curl --fail --location --silent --show-error \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64/chrome-headless-shell-linux64.zip" \
            --output "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP/moviestar-chrome"
          chrome_path="$RUNNER_TEMP/moviestar-chrome/chrome-headless-shell-linux64/chrome-headless-shell"
          "$chrome_path" --version
          node --version
          echo "MOVIESTAR_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Install moviestar
        run: |
          cd app
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Check three-person edits, per-scene playback and rendered cuts
        run: |
          cd app
          source .venv/bin/activate
          pytest tests/test_native_interview_browser.py -q --basetemp="$RUNNER_TEMP/native-interview"

      - name: Retain generated interview evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-interview-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-interview/test_actual_interview_*/browser
            ${{ runner.temp }}/native-interview/test_terminal_interview_*/browser
          if-no-files-found: ignore
          retention-days: 7

      # Retain the first source-only cut result before any later work. These
      # tests run once here and are excluded from the remaining full suite.
      - name: Check source-audio cut playback
        run: |
          cd app
          source .venv/bin/activate
          pytest tests/test_native_cuts_browser.py -q --basetemp="$RUNNER_TEMP/native-cuts"

      - name: Retain generated source-cut playback evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-source-cuts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-cuts/test_actual_native_cuts_keep_*/browser/*.json
          if-no-files-found: ignore
          retention-days: 7

      # Fail quickly on real-time PiP playback; run each test once in this
      # job. The remaining suite retains every fast and slow test.
      - name: Check native PiP playback
        id: native-pip
        run: |
          cd app
          source .venv/bin/activate
          pytest tests/test_native_pip_browser.py -q --basetemp="$RUNNER_TEMP/native-pip"

      # Diagnostic only: never replace the first acceptance result with a rerun.
      # The generated fixture's compressed trace is retained in job logs.
      - name: Trace a native cut failure
        if: failure() && steps.native-pip.outcome == 'failure'
        continue-on-error: true
        env:
          MOVIESTAR_NATIVE_TRACE: '1'
        run: |
          cd app
          source .venv/bin/activate
          pytest tests/test_native_pip_browser.py -s -q --basetemp="$RUNNER_TEMP/native-pip-trace"

      - name: Retain generated native playback evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-pip-playback-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-pip/test_independent_audio_*/browser/*.json
            ${{ runner.temp }}/native-pip/test_independent_audio_*/browser/*.wav
            ${{ runner.temp }}/native-pip/test_two_tracks_*/browser/*.json
            ${{ runner.temp }}/native-pip/test_two_tracks_*/browser/*.wav
          if-no-files-found: ignore
          retention-days: 7

  spatial-stream-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sources: [4, 5]
        canvas: [1080p, 4k]
    container:
      image: python:3.12-bookworm
      options: --memory 4g --memory-swap 4g --cpus 2 --cpuset-cpus 0-1
    env:
      MOVIESTAR_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install container render dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg procps curl unzip fonts-liberation libnss3 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2
          python -m pip install -e ./app "av==18.1.0"
      - name: Install pinned headless renderer
        run: |
          curl --fail --location --silent --show-error \
            https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.73/linux64/chrome-headless-shell-linux64.zip \
            --output "$RUNNER_TEMP/chrome.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/chrome"
          echo "MOVIESTAR_CHROME_PATH=$RUNNER_TEMP/chrome/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Measure a complete short/long resource pair
        run: |
          python experiments/spatial_stream_performance/measure.py \
            --out "$RUNNER_TEMP/spatial-stream-memory" --short 4 --long 16 \
            --sources ${{ matrix.sources }} --canvas ${{ matrix.canvas }} \
            --require-limit-mib 4096 --require-cpus 2
      - name: Retain all resource results and first failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spatial-stream-memory-${{ matrix.sources }}-${{ matrix.canvas }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/spatial-stream-memory/summary.json
            ${{ runner.temp }}/spatial-stream-memory/**/result.json
            ${{ runner.temp }}/spatial-stream-memory/**/source-opens.json
            ${{ runner.temp }}/spatial-stream-memory/**/stages.json
            ${{ runner.temp }}/spatial-stream-memory/**/stdout
            ${{ runner.temp }}/spatial-stream-memory/**/stderr
          if-no-files-found: warn
