name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-and-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate public docs and Moviestar skill
        run: |
          python -m pip install pytest
          python -m pip install --no-deps -e ./app
          python -m pytest \
            app/tests/test_public_docs_and_skill.py \
            app/tests/test_release_plumbing.py \
            -q

  compositor-python310:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e ./app pytest "numpy==1.24.4"
      - name: Compare the compositor with FFmpeg on the oldest supported Python
        run: |
          python -m pytest app/tests/test_spatial_composite.py -q
          python bin/check-dependency-licenses

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MOVIESTAR_CHROME_NO_SANDBOX: '1'

    steps:
      - uses: actions/checkout@v6

      # Cache pip downloads (~150MB of wheels: PyAV, CTranslate2, ONNX
      # Runtime, NumPy) so install time doesn't depend on PyPI throughput;
      # a slow mirror once stretched install to 18 minutes and timed out
      # the job. The venv's pip shares this ~/.cache/pip.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/pyproject.toml

      # Moviestar shells out to FFmpeg and ffprobe for media operations.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # Exercise the supported headless-shell renderer explicitly rather than
      # whichever desktop Chrome happens to ship in the runner image.
      - name: Install Chrome for Testing headless shell
        env:
          CHROME_FOR_TESTING_VERSION: '156.0.8078.73'
        run: |
          archive="$RUNNER_TEMP/moviestar-chrome.zip"
          curl --fail --location --silent --show-error \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64/chrome-headless-shell-linux64.zip" \
            --output "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP/moviestar-chrome"
          chrome_path="$RUNNER_TEMP/moviestar-chrome/chrome-headless-shell-linux64/chrome-headless-shell"
          "$chrome_path" --version
          node --version
          echo "MOVIESTAR_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      # Cache the faster-whisper tiny model so CI doesn't re-download ~75MB
      # on every run. Key includes the model name; bump to invalidate.
      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-tiny-v1

      - name: Install moviestar
        run: |
          cd app
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Check renderer cold startup
        run: |
          source app/.venv/bin/activate
          python - <<'PY'
          from moviestar.spatial_layout import browser_available, measure_spatial_layout
          assert browser_available(), 'Renderer CI requires Chrome headless shell and Node.js 22+'
          measured = measure_spatial_layout({'scene_id': 'ci_smoke', 'children': []}, {'width': 64, 'height': 64})
          assert measured['boxes'] == []
          print('Configured renderer completed a cold-start measurement.')
          PY

      - name: Check dependency license policy
        run: |
          source app/.venv/bin/activate
          bin/check-dependency-licenses

      # --captions URL needs the url-captions extra (yt-dlp). Install it
      # after the core check so the fast tests cover the real backend too.
      - name: Check url-captions extra license policy
        run: |
          source app/.venv/bin/activate
          pip install -e "./app[url-captions]"
          bin/check-dependency-licenses --extra url-captions

      # Fail quickly on real-time PiP playback; run each test once across these
      # two steps. The remaining suite retains every fast and slow test.
      - name: Check native PiP playback
        id: native-pip
        run: |
          cd app
          source .venv/bin/activate
          pytest tests/test_native_pip_browser.py -q --basetemp="$RUNNER_TEMP/native-pip"

      # Diagnostic only: never replace the first acceptance result with a rerun.
      # The generated fixture's compressed trace is retained in job logs.
      - name: Trace a native cut failure
        if: failure() && steps.native-pip.outcome == 'failure'
        continue-on-error: true
        env:
          MOVIESTAR_NATIVE_TRACE: '1'
        run: |
          cd app
          source .venv/bin/activate
          pytest tests/test_native_pip_browser.py -s -q --basetemp="$RUNNER_TEMP/native-pip-trace"

      - name: Run full suite (with --run-slow)
        run: |
          cd app
          source .venv/bin/activate
          pytest --run-slow --ignore=tests/test_native_pip_browser.py --basetemp="$RUNNER_TEMP/full-suite"

      - name: Retain generated native playback evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-cut-playback-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/full-suite/test_actual_native_cuts_keep_*/browser/*.json
            ${{ runner.temp }}/native-pip/test_independent_audio_*/browser/*.json
            ${{ runner.temp }}/native-pip/test_independent_audio_*/browser/*.wav
            ${{ runner.temp }}/native-pip/test_two_tracks_*/browser/*.json
            ${{ runner.temp }}/native-pip/test_two_tracks_*/browser/*.wav
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and check package artifacts
        run: |
          source app/.venv/bin/activate
          python -m pip install build twine
          python -m build app
          python -m twine check app/dist/*
